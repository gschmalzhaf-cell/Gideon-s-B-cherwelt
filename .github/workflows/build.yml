name: Build (Debug)

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: 9.9.1

      - name: Gradle-Wrapper erzeugen
        run: gradle wrapper --gradle-version 9.9.1 --distribution-type bin

      - name: Android SDK 37 sicherstellen
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37" "build-tools;37.0.0" || true

      - name: Debug-APK bauen (assembleDebug)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v6
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
