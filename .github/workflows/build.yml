name: Build (Debug)

on:
  push:
    branches: [main, "vibe/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.7

      - name: Gradle-Wrapper erzeugen
        run: gradle wrapper --gradle-version 8.14.7 --distribution-type bin

      - name: Debug-APK bauen (assembleDebug)
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: APK als Artifact hochladen
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: app/build/outputs/apk/debug/app-debug.apk
